
name: Build PercentBoosts 26.3

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build Minecraft mod
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace build 2>&1 | tee build-output.log

      - name: Upload compiled JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PercentBoosts-26.3-JAR
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload error logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PercentBoosts-Build-Logs
          path: build-output.log
          if-no-files-found: warn
